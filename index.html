<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>우림중 3학년 교과서 10단계 워크북</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>

:root{--bg:#f5f5f2;--card:#fff;--ink:#1c1d21;--sub:#686a72;--line:#e1e0da;--acc:#2f5bd3;--acc2:#e8eefc;--ok:#1f8a4c;--okbg:#e5f4ea;--ng:#c8372d;--ngbg:#fbe9e7;--box:#f0efe9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1f1f23;--ink:#ececef;--sub:#9a9aa2;--line:#33333a;--acc:#7c9cff;--acc2:#252d45;--ok:#5cc98a;--okbg:#17301f;--ng:#ff7b70;--ngbg:#3a1d1b;--box:#29292e}}
:root[data-theme="dark"]{--bg:#141416;--card:#1f1f23;--ink:#ececef;--sub:#9a9aa2;--line:#33333a;--acc:#7c9cff;--acc2:#252d45;--ok:#5cc98a;--okbg:#17301f;--ng:#ff7b70;--ngbg:#3a1d1b;--box:#29292e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Malgun Gothic","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
button:focus-visible,.opt:focus-within,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:20px 16px 80px}
.brand{margin:0 0 16px;background:#fff;border:1px solid #E8D9B0;border-radius:14px;padding:8px 12px;box-shadow:0 2px 10px rgba(0,0,0,.10);color-scheme:light}
.brand img{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;border-radius:6px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:22px;margin:0;letter-spacing:-.3px;text-wrap:balance}
h1 small{display:block;font-size:13px;color:var(--sub);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0}
#name{flex:1;min-width:160px}
button{font:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.muted{color:var(--sub);font-size:14px}
.grp{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.grp:first-of-type{border-top:0;margin-top:4px;padding-top:0}
.grphead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grphead b{font-size:15px}
.grphead button{padding:5px 12px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;margin-top:8px}
.grid button{padding:8px 0;font-size:13px;font-weight:500;background:var(--bg);color:var(--ink);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.grid button.pass{border-color:var(--ok);color:var(--ok)}
.grid button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.lpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.lp{display:flex;flex-direction:column;gap:6px}
.lpbtn{width:100%;padding:10px 6px;font-size:16px;font-weight:700;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.lpbtn small{display:block;font-size:12px;font-weight:400;margin-top:2px;opacity:.8}
.lpkinds{display:flex;gap:6px}
.lpkinds button{flex:1;padding:5px 4px;font-size:12px;font-weight:500;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.lpbtn.on,.lpkinds button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.grid.toc{grid-template-columns:1fr;gap:5px}
.grid.toc button{text-align:left;padding:10px 12px;font-size:14.5px;border-radius:10px;font-variant-numeric:normal}
.npick{margin:0 0 8px}.npick select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.selbar{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(transparent,var(--bg) 25%)}
.selbar .card{margin:0;display:grid;gap:8px}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-right:6px;white-space:nowrap}
.src{font-size:12px;font-weight:600;color:var(--sub);margin-right:6px}
.q h3{font-size:16px;margin:0 0 10px;font-weight:600;line-height:1.5}
.passage,.given,.sbox,.chunk{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;line-height:1.7}
.passage{background:var(--box);border-radius:10px;padding:12px 14px;margin:0 0 12px}
.passage p{margin:0 0 10px}.passage p:last-child{margin:0}
.given{border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;margin:0 0 10px}
.sbox{border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;margin:0 0 12px}
u{text-decoration-thickness:1.5px;text-underline-offset:3px}
.nemo{white-space:nowrap;border:1.5px solid var(--ink);border-radius:4px;padding:0 4px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:6px}
.opt.en{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:16.5px}
.opt.sel{border-color:var(--acc);background:var(--acc2)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--ng);background:var(--ngbg)}
.subq{margin-top:14px}
.subq h4{font-size:15px;margin:0 0 8px;font-weight:600}
.saline{display:grid;gap:6px;margin-bottom:12px}
.saline .prompt{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:16.5px}
.saline input{width:100%}
.saline input.right{border-color:var(--ok);background:var(--okbg)}
.saline input.wrong{border-color:var(--ng);background:var(--ngbg)}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pick .lab{font-weight:600;min-width:34px}
.pick .opt{padding:7px 12px}
.mark{font-weight:800;margin-left:6px}.mark.o{color:var(--ok)}.mark.x{color:var(--ng)}
.mq{font-size:17px;line-height:1.8;margin:2px 0 10px}.mq p{margin:0 0 6px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.12;margin:0 .1em;font-variant-numeric:tabular-nums}.fr>span:first-child{border-bottom:1.4px solid currentColor;padding:0 .2em .06em}.fr>span:last-child{padding:.06em .2em 0}
.mq svg,.opt svg,.ex svg{max-width:100%;height:auto;vertical-align:middle}.fig{display:block;margin:6px auto 2px}.bx{display:inline-block;min-width:1.5em;height:1.25em;border:1.5px solid currentColor;border-radius:2px;vertical-align:middle;margin:0 .12em}
.ex{white-space:pre-line;margin-top:10px;font-size:14px;padding:10px 12px;border-left:3px solid var(--acc);background:var(--acc2);border-radius:0 8px 8px 0}
.banner{text-align:center;padding:24px 16px}
.banner .big{font-size:40px;font-weight:800;letter-spacing:2px}
.banner.pass{background:var(--okbg);border-color:var(--ok)}.banner.pass .big{color:var(--ok)}
.banner.fail{background:var(--ngbg);border-color:var(--ng)}.banner.fail .big{color:var(--ng)}
.banner.score{background:var(--acc2);border-color:var(--acc)}.banner.score .big{color:var(--acc)}
.pts{font-size:12px;font-weight:700;color:var(--sub);margin-left:4px;white-space:nowrap}
.bottom{position:sticky;bottom:0;padding:12px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.bottom button{width:100%;padding:14px;font-size:17px}
textarea{display:block;width:100%;font:inherit;font-size:15px;line-height:1.55;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical;margin:8px 0}
.cert{margin-top:18px;text-align:left}
.tablewrap{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
td.wrap{white-space:normal;min-width:180px}
th{font-size:12px;color:var(--sub);font-weight:600;letter-spacing:.03em}
td button{padding:4px 10px;font-size:13px}
.okc{color:var(--ok);font-weight:700}.ngc{color:var(--ng);font-weight:700}
.h2{font-size:18px;margin:0}
.mycert{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.mycert button{padding:6px 12px;font-size:14px}
.logrow{border-top:1px solid var(--line);padding:9px 0}
.logrow summary{cursor:pointer;font-variant-numeric:tabular-nums}
.logrow summary span{margin-right:8px}
.wr{margin:10px 0 0;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px;display:grid;gap:4px}
.teacherlink{text-align:center;margin:18px 0 0}
.chunk{border-top:1px dashed var(--line);padding:6px 2px}.cl{font-weight:700}
.sumbox,.kobox{border:1.5px solid var(--ink);border-radius:8px;padding:10px 12px;margin:8px 0 12px;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:16.5px;line-height:1.65}
.kobox{font-family:inherit;font-size:15px;border-width:1px;border-left:3px solid var(--acc)}
.cond,.gw{border:1px dashed var(--sub);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14px;line-height:1.6}
.cond ol,.cond ul{margin:4px 0 0 18px;padding:0}.gwl{font-weight:700;color:var(--acc)}
.passage p.bul{padding-left:12px;text-indent:-12px}
u.ul2{font-weight:600}.vb{border-bottom:1.5px solid var(--ink);font-weight:600;white-space:nowrap}
.slot{font-weight:800;color:var(--ng);padding:0 2px}
.datatbl{border-collapse:collapse;width:100%;font-size:13px;margin:0 0 10px;font-family:inherit}
.datatbl caption{font-weight:700;text-align:left;margin-bottom:4px}
.datatbl th,.datatbl td{border:1px solid var(--sub);padding:2px 4px;text-align:center;white-space:normal;font-size:12px}
.hint{color:#64748b;font-size:.92em}
.notice{border:1.5px solid var(--acc);background:var(--acc2);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.55}
select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);flex:1;min-width:160px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
[hidden]{display:none!important}

.notice{border:1.5px solid var(--acc);background:var(--acc2);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;line-height:1.6}
a.ghost{display:inline-block;font-size:14px;color:var(--acc);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-decoration:none;font-weight:600}
.chap{border-top:1px solid var(--line)}
.chap:first-of-type{border-top:0}
.chap>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;color:var(--ink);padding:12px 2px;font-weight:600;text-align:left;border-radius:0}
.chap>button .n{font-size:12.5px;font-weight:500;color:var(--sub);white-space:nowrap}
.chap>button .n.ok{color:var(--ok);font-weight:700}
.secs{display:grid;gap:8px;padding:0 0 14px}
.secs button{display:block;width:100%;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px 12px;font-size:14.5px;font-weight:600;line-height:1.4}
.secs button .u{display:block;font-size:12.5px;font-weight:500;color:var(--sub);margin-top:2px}
.secs button .st{display:inline-block;font-size:12px;font-weight:700;margin-top:4px;padding:1px 8px;border-radius:99px;background:var(--box);color:var(--sub)}
.secs button .st.ok{background:var(--okbg);color:var(--ok)}.secs button .st.go{background:var(--acc2);color:var(--acc)}
.secs button.hit{border:2px solid var(--acc)}
.find{display:flex;gap:8px;align-items:center;margin-top:12px}
.find input{width:110px}
.meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:2px 0 14px}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.wx h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.wx h3 .m{font-size:13px;font-weight:700}.wx h3 .m.o{color:var(--ok)}.wx h3 .m.x{color:var(--ng)}
.wx figure{margin:0 0 6px;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;color-scheme:light}
.wx figure img{display:block;width:100%;height:auto}
.wx .tip{font-size:12.5px;color:var(--sub);margin:0 0 12px}
.it{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:1px dashed var(--line)}
.it .q{font-weight:800;color:var(--acc);min-width:28px;font-size:15px;padding-top:9px}
.it .h{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:16.5px;line-height:1.5;margin-bottom:5px}
.it .h u{display:inline-block;min-width:44px;border-bottom:1.5px solid var(--sub);text-decoration:none;height:1em;vertical-align:baseline}
.it .free{font-size:11.5px;font-weight:700;color:var(--sub);background:var(--box);border-radius:6px;padding:1px 6px;margin-left:6px;font-family:"Malgun Gothic","Noto Sans KR",sans-serif}
.it input,.it textarea{width:100%;font:17px/1.4 "Malgun Gothic","Noto Sans KR",sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:0}
.it .ok:is(input,textarea){border-color:var(--ok);background:var(--okbg)}
.it .ng:is(input,textarea){border-color:var(--ng);background:var(--ngbg)}
.it .fb{font-size:14px;margin-top:5px;line-height:1.5}
.it .fb .a{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;font-weight:600}
.it .fb.ok{color:var(--ok)}.it .fb.ng{color:var(--ng)}.it .fb.ex{color:var(--sub)}
.banner{border-width:1.5px}.banner .big{font-size:24px;font-weight:800;margin-bottom:4px}
.banner.pass{background:var(--okbg);border-color:var(--ok)}.banner.pass .big{color:var(--ok)}
.banner.fail{background:var(--ngbg);border-color:var(--ng)}.banner.fail .big{color:var(--ng)}
.bottom{position:sticky;bottom:0;background:var(--bg);padding:10px 0 12px;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line)}
.bottom button{flex:1;padding:10px 12px;font-size:15px}
textarea{width:100%;font:13px/1.5 ui-monospace,Menlo,monospace;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:96px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;overflow:auto;-webkit-overflow-scrolling:touch;cursor:zoom-out}
#zoom img{display:block;width:1200px;max-width:none;margin:0 auto;background:#fff}
#zoom .x{position:fixed;top:10px;right:12px;background:#fff;color:#000;border-radius:99px;padding:6px 14px;font-weight:700}

<style>
/* 모의고사 10단계 워크북(2026-10-21) — 숙제 워크북(giu) 머리·바탕 위에 덧붙이는 부분 */
.kc0{color:#c2410c}.kc1{color:#1d6fc4}.kc2{color:#be185d}.kc3{color:#0f766e}.kc4{color:#6d28d9}
@media (prefers-color-scheme: dark){.kc0{color:#fb923c}.kc1{color:#60a5fa}.kc2{color:#f472b6}.kc3{color:#2dd4bf}.kc4{color:#a78bfa}}
.kw{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.pc{color:var(--c)}   /* e4y WB1: PDF의 색 그대로 */
@media (prefers-color-scheme: dark){.pc{color:color-mix(in srgb,var(--c) 60%,#fff)}}
.kb{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 12px}
.steps button{padding:6px 2px;font-size:13px;font-weight:800;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;line-height:1.2}
.steps button small{display:block;font-size:10.5px;font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps button.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.steps button.go{background:var(--acc2)}
.steps button.on{outline:2.5px solid var(--acc);outline-offset:1px}
.steps button.lk{opacity:.35}
.lockn{margin:-4px 0 10px;font-size:13px;line-height:1.5;color:var(--sub)}
.lockn.flash{color:#dc2626;font-weight:700;animation:lkf .45s}
@keyframes lkf{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.wbh{font-size:16px;font-weight:800;margin:0 0 2px}.wbh span{color:var(--acc)}
.inst{font-size:13.5px;color:var(--sub);margin:0 0 6px}
.ss{padding:11px 0;border-top:1px dashed var(--line)}
.ss:first-of-type{border-top:0}
.ss .n{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-weight:800;color:var(--acc);margin-right:7px;font-size:14px}
.en{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;line-height:1.85}
.ko{font-size:14.5px;line-height:1.85;margin-top:2px}
.ss.fixl .en,.ss.fixl .ko{color:var(--sub)}
input.bl{font:inherit;display:inline-block;padding:1px 6px;margin:0 2px;border:0;border-bottom:2px solid var(--sub);border-radius:6px 6px 0 0;background:var(--box);color:var(--ink);min-height:0;max-width:100%;vertical-align:baseline}
input.bl:focus{outline:2px solid var(--acc);outline-offset:1px}
input.bl.ok,textarea.ok{border-color:var(--ok);background:var(--okbg)}
input.bl.ng,textarea.ng{border-color:var(--ng);background:var(--ngbg)}
.fbi{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:13px;font-weight:800;margin:0 3px}
.fbi.ng{color:var(--ng)}
.vh{font-weight:800;color:var(--acc)}
.opt{display:inline-flex;border:1.5px solid var(--sub);border-radius:8px;overflow:hidden;vertical-align:baseline;margin:0 2px}
.opt button{background:var(--bg);color:var(--ink);padding:0 9px;font:inherit;font-weight:600;border:0;border-radius:0;min-height:0}
.opt button+button{border-left:1.5px solid var(--sub)}
.opt button.sel{background:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok)}.opt.ok button.sel{background:var(--ok)}
.opt.ng{border-color:var(--ng)}.opt.ng button.sel{background:var(--ng)}
.opt.ng button.right{outline:2px dashed var(--ok);outline-offset:-3px}
.p7{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;line-height:2}
.u7{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;font-weight:600;cursor:pointer;border-radius:4px;padding:0 1px}
.u7 sup{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:11px;font-weight:800;color:var(--acc);margin-left:1px}
.u7.sel{background:var(--acc2)}.u7.ok{background:var(--okbg);color:var(--ok)}.u7.ng{background:var(--ngbg)}
.u7.miss{outline:2px dashed var(--ng);outline-offset:1px}
.rows7 .it{grid-template-columns:auto 1fr}
.rows7 .h{font-size:15.5px}
.line8{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:6px}
.anch{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:16.5px;color:var(--sub)}
.zone{flex:1 1 100%;min-height:40px;border:1.5px dashed var(--sub);border-radius:10px;padding:5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.zone:empty::before{content:"아래 낱말을 순서대로 누르세요";font-size:12.5px;color:var(--sub);padding-left:4px}
.pool{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.chip{background:var(--box);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font:16px/1.35 "Malgun Gothic","Noto Sans KR",sans-serif;font-weight:600;min-height:0}
.zone .chip{background:var(--acc2);border-color:var(--acc);color:var(--acc)}
.chip.used{visibility:hidden}
.zone.ok{border:1.5px solid var(--ok);background:var(--okbg)}.zone.ok .chip{background:transparent;border-color:var(--ok);color:var(--ok)}
.zone.ng{border:1.5px solid var(--ng);background:var(--ngbg)}
.ans{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:15.5px;font-weight:600;color:var(--ok);margin-top:4px}
.p9box{border:1.5px solid var(--ink);border-radius:10px;padding:10px 13px;margin:8px 0}
.p9box p{margin:0 0 10px;font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:16.5px;line-height:1.75}
.p9box p:last-child{margin:0}
.p9box b{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;color:var(--acc);margin-right:6px}

/* 콘텐츠 보호(2026-10-06) — 공용 조각(examapp/unlock.js). 빌더(content_crypt.inject)가 각 틀의 UNLOCK 표식 자리에 넣는다.
   D.enc = base64(iv + AES-256-GCM(gzip JSON)). 열쇠(16진수 64자)는 서버 start 응답 g.key 또는 이 기기에 저장된 값.
   UNLOCK.run(D, g, st[, target]): {ok:true, key}면 풀린 내용이 target(기본 D)에 합쳐진 뒤, {ok:false, msg}면 msg를 학생에게 보인다.
   st = {get(), set(v), del()} 열쇠 저장소(엔진마다 localStorage 이름공간이 달라 밖에서 준다). D.enc가 없는 옛 페이지는 그대로 통과.
   그림: <img data-enc="경로.bin"> 을 UNLOCK.lazy(root, cryptoKey)가 보일 때 받아 풀어 blob 주소로 넣는다(.bin이 아니면 그대로 src).
   음원(2026-11-02): <audio data-enc="경로.bin" data-type="audio/mp4"> 도 같은 방식(보일 때 받아 풀어 src). */
const UNLOCK = (() => {
  const hex2b = h => Uint8Array.from(String(h || '').match(/../g) || [], x => parseInt(x, 16));
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function keyOf(hex) { return crypto.subtle.importKey('raw', hex2b(hex), 'AES-GCM', false, ['decrypt']); }
  async function openBytes(key, buf) {   // key: CryptoKey, buf: ArrayBuffer|Uint8Array(iv + 본문) → ArrayBuffer
    const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    return crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, key, b.slice(12));
  }
  async function open(keyHex, encB64) {
    const plain = await openBytes(await keyOf(keyHex), b64(encB64));
    const s = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(s).text());
  }
  const MSG_NET = '처음 쓰는 기기는 인터넷 연결이 필요합니다. 통신 상태를 확인한 뒤 다시 시도하세요.';

  const MSG_FAIL = '내용을 여는 데 실패했습니다. 앱을 새로 고친 뒤 다시 시도하세요.';
  const MSG_OLD = '이 브라우저에서는 열 수 없습니다. 최신 Safari 또는 Chrome으로 여세요.';
  const able = () => !!(window.isSecureContext && window.crypto && crypto.subtle && typeof DecompressionStream !== 'undefined');

    if (!able()) return {ok: false, msg: MSG_OLD};
    const fresh = g && typeof g.key === 'string' && g.key.length === 64 ? g.key : '';
